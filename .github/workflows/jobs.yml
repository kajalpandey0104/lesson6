name: Lesson 6 - Jobs Demo

on:
  push:

jobs:

  build-job:
    name: Build Job
    runs-on: ubuntu-latest

    container:
      image: oven/bun:latest

    outputs:
      build-output: ${{ steps.step1.outputs.bun-version }}

    steps:
      - name: Get Bun Version
        id: step1

        run: |
          version=$(bun --version)
          echo "bun-version=$version" >> $GITHUB_OUTPUT

  deploy-job:
    name: Deploy Job
    runs-on: ubuntu-latest

    needs: build-job

    steps:
      - name: Test Build Output

        run: |
          echo "Build Output:"
          echo "${{ needs.build-job.outputs.build-output }}"

  concurrency-job1:
    name: Concurrency Job 1
    runs-on: ubuntu-latest

    concurrency:
      group: test-concurrency
      cancel-in-progress: false

    steps:
      - name: Sleep Job 1

        run: sleep 15

  concurrency-job2:
    name: Concurrency Job 2
    runs-on: ubuntu-latest

    concurrency:
      group: test-concurrency
      cancel-in-progress: false

    steps:
      - name: Sleep Job 2

        run: sleep 15
